[package]
name = "inputflow-core"
description = "Platform-independent InputFlow engine: action registry, menu resolution, settings, text utilities, calculator, snippets."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
urlencoding = "2"
thiserror = "2"
