name: Diagnose Windows
# Runs the Windows build on a real Windows runner, attaches to WebView2 over the
# DevTools protocol and uploads console errors, DOM state and screenshots.
on:
  workflow_dispatch:
  push:
    branches: ['diag/**']

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: diag-win }
      - run: npm ci
      - name: Build (release, no installer)
        run: npx tauri build --no-bundle
      - name: WebView2 runtime version on this machine
        shell: pwsh
        run: |
          $k = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          (Get-ItemProperty $k -ErrorAction SilentlyContinue).pv | Tee-Object webview2-version.txt
      - name: Run app and collect WebView2 diagnostics
        shell: pwsh
        run: |
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222"
          $env:RUST_LOG = "debug"
          $p = Start-Process -FilePath "target\release\minpoint.exe" -PassThru -RedirectStandardOutput app-stdout.txt -RedirectStandardError app-stderr.txt
          node dev/diagnose-webview.mjs diag
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("diag\desktop.png")
          "running: $(-not $p.HasExited)  exitcode: $($p.ExitCode)" | Tee-Object diag\process.txt
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Copy-Item app-stdout.txt, app-stderr.txt, webview2-version.txt diag\ -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA\app.minpoint.desktop\logs\minpoint.log" diag\ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-diagnostics
          path: diag/

  # Installer behaviour while MinPoint is running: upgrade over a running app,
  # then uninstall a running app. Also extracts the installer/uninstaller icons.
  installer-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: diag-win-installer }
      - run: npm ci
      - name: Build installer
        run: npx tauri build --bundles nsis
      - name: Install, upgrade while running, uninstall while running
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          $setup = (Get-ChildItem target\release\bundle\nsis\*-setup.exe | Select-Object -First 1).FullName
          $dir = "$env:LOCALAPPDATA\MinPoint"
          function Running { @(Get-Process minpoint -ErrorAction SilentlyContinue).Count }
          function Shot($name) {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("out\$name.png")
          }
          function Icon($exe, $name) {
            Add-Type -AssemblyName System.Drawing
            [System.Drawing.Icon]::ExtractAssociatedIcon($exe).ToBitmap().Save("out\$name.png")
          }
          Icon $setup "icon-setup"

          "1) fresh install" | Tee-Object -Append out\steps.txt
          Start-Process $setup -ArgumentList "/S" -Wait
          Start-Process "$dir\minpoint.exe"; Start-Sleep 8
          "   running processes: $(Running)" | Tee-Object -Append out\steps.txt
          Icon "$dir\uninstall.exe" "icon-uninstall"
          Icon "$dir\minpoint.exe" "icon-app"

          "2) install again while MinPoint is running" | Tee-Object -Append out\steps.txt
          $p = Start-Process $setup -ArgumentList "/S" -Wait -PassThru
          "   installer exit code: $($p.ExitCode); still running: $(Running); exe present: $(Test-Path "$dir\minpoint.exe")" | Tee-Object -Append out\steps.txt

          "3) uninstall while MinPoint is running" | Tee-Object -Append out\steps.txt
          Start-Process "$dir\minpoint.exe"; Start-Sleep 8
          "   running before uninstall: $(Running)" | Tee-Object -Append out\steps.txt
          $u = Start-Process "$dir\uninstall.exe" -ArgumentList "/S", "_?=$dir" -Wait -PassThru
          "   uninstaller exit code: $($u.ExitCode); still running: $(Running); exe present: $(Test-Path "$dir\minpoint.exe")" | Tee-Object -Append out\steps.txt
          Shot "after"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-test
          path: out/
