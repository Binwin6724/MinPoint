name: Diagnose Windows
# Runs the Windows build on a real Windows runner, attaches to WebView2 over the
# DevTools protocol and uploads console errors, DOM state and screenshots.
on:
  workflow_dispatch:
  push:
    branches: ['diag/**']

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: diag-win }
      - run: npm ci
      - name: Build (release, no installer)
        run: npx tauri build --no-bundle
      - name: Run app and collect WebView2 diagnostics
        shell: pwsh
        run: |
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222"
          $env:RUST_LOG = "debug"
          $p = Start-Process -FilePath "target\release\minpoint.exe" -PassThru -RedirectStandardOutput app-stdout.txt -RedirectStandardError app-stderr.txt
          node dev/diagnose-webview.mjs diag
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("diag\desktop.png")
          "running: $(-not $p.HasExited)  exitcode: $($p.ExitCode)" | Tee-Object diag\process.txt
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Copy-Item app-stdout.txt, app-stderr.txt diag\ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-diagnostics
          path: diag/
