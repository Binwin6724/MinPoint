name: Release

# Builds InputFlow for macOS (universal) and Windows (x64) and attaches the
# installers to a GitHub pre-release. Triggered by pushing a tag like v0.1.0.
# Builds are UNSIGNED until signing secrets are configured (see PLATFORM_COMPATIBILITY.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run helper:mac
      - run: npm run build
      - run: npm test
      - run: cargo test --workspace

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build macOS native helper
        if: matrix.platform == 'macos-latest'
        run: npm run helper:mac
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: InputFlow ${{ github.ref_name }}
          releaseBody: |
            Early development pre-release. See CHANGELOG.md and PLATFORM_COMPATIBILITY.md.

            **macOS**: universal (Apple Silicon + Intel), unsigned. Right-click the app → Open the first time. Shift + Right Click needs Accessibility and Input Monitoring permission.
            **Windows**: builds and runs, but system-wide features (context menu, text insertion, OCR, clipboard history) are not implemented on Windows yet — only the in-app local tools work. Unsigned, so SmartScreen will warn.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
